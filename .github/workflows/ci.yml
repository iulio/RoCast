name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev + nowcast extras
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev,nowcast]"
      - name: Lint
        run: ruff check rocast tests scripts
      - name: Unit and integration tests
        run: python -m pytest -v
      - name: Smoke-test the CLI (synthetic, 1 epoch)
        run: python -m rocast.cli backtest --mode synthetic --epochs 1 --days 8 --train-stride 12 --n-test-windows 2 --output-dir outputs_ci

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install and smoke-test the wheel outside the checkout
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          rocast --version
          rocast polygon-forecast --coords '[[25,44],[26,44],[26,45],[25,45]]' --hours 1 --capacity-mw 100 --output polygon.csv
          test "$(wc -l < polygon.csv)" -eq 5
      - uses: actions/upload-artifact@v6
        with:
          name: rocast-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
